data:
  category: all
  data_root: data/bmad
  dataset_name: bmad_all
  img_size: 256
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  test_batch_size: 32
  transform_type: imagenet
flow_matching:
  loss_type: velocity
  pred_type: velocity
  scheduler:
    name: affine_prob
    t_mu: -0.8
    t_scheduler_infer: linear
    t_scheduler_train: linear
    t_sigma: 0.8
  solver:
    name: euler
  train_steps: -1
logging:
  eval:
    eval_strategy: recon
    exact_divergence: false
    hutchinson_batch_size: 2
    hutchinson_samples: 10
    img_score_agg: diff+sum
    inv_steps: 20
    inv_stop_time: 0.1
    metrics:
    - img_auroc
    - img_ap
    - img_f1max
    - px_auroc
    - px_ap
    - px_f1max
    - px_aupro
    recon_steps: 3
    save_dir: ./logs/bmad_mc_ditB_enet_042411/
    solver_name: euler
    steps: 1
  log_dir: logs/bmad_mc_ditB_enet_042411/
meta:
  global_seed: 0
  name: vfad
  use_bfloat16: false
model:
  backbone:
    model_name: efficientnet-b4
    normalization: null
    outblocks:
    - 1
    - 5
    - 9
    - 21
    outstrides:
    - 2
    - 4
    - 8
    - 16
    pretrained: true
  class_dropout_prob: 0.0
  cond_channels: 768
  depth: 12
  hidden_size: 768
  learn_sigma: false
  mlp_ratio: 4.0
  model_name: dit
  num_heads: 12
  patch_size: 1
  t_scale: 1000
  use_class_labels: true
resume:
  resume_path: ./logs/bmad_mc_ditB_enet_042411/checkpoints/ckpt_epoch_300.pth
