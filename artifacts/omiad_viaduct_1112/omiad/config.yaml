asd:
  alpha: 1.0
  disc_norm: rms
  ema_rate: 0.999
  lambda_adv_psi: 0.01
  lambda_adv_theta: 1.0
  t_init: 960
  t_max: 990
  teacher_key: model
  teacher_path: baselines/amdm_repro/out/amdm_viaduct_1112/checkpoints/ckpt_epoch_300.pth
data:
  category: all
  data_root: data/viaduct
  dataset_name: viaduct_all
  img_size: 224
  num_workers: 16
  persistent_workers: false
  pin_memory: true
  test_batch_size: 64
  train_batch_size: 32
  transform_type: imagenet
diffusion:
  beta_end: 0.02
  beta_start: 0.0001
  k: 2.0
  num_timesteps: 1000
  p_max: 0.4
  p_min: 0.1
logging:
  eval:
    eval_epoch_freq: 50
    eval_variants:
    - img_score_agg: max
    - img_score_agg: diff+sum
    img_score_agg: max
    metrics:
    - img_auroc
    - img_ap
    - img_f1max
    - px_auroc
    - px_ap
    - px_f1max
    - px_aupro
    recon_steps: 1
    t_init: 960
  log_dir: baselines/amdm_repro/out/omiad_viaduct_1112/
  log_step_freq: 100
meta:
  name: omiad
model:
  attention_ds:
  - 2
  - 4
  backbone:
    model_name: efficientnet-b4
    normalization: null
    outblocks:
    - 1
    - 5
    - 9
    - 21
    outstrides:
    - 2
    - 4
    - 8
    - 16
    pretrained: true
  channel_mult:
  - 1
  - 2
  - 2
  - 2
  dropout: 0.0
  feature_size: 32
  in_channels: 272
  model_channels: 128
  num_head_channels: -1
  num_heads: 4
  num_res_blocks: 2
  resblock_updown: false
  use_scale_shift_norm: true
opt:
  betas:
  - 0.0
  - 0.999
  clip_grad: 0.0
  epochs: 300
  global_seed: 0
  lr_g: 1.0e-05
  lr_psi: 1.0e-05
