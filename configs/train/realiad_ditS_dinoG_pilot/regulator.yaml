data:
  category: regulator
  data_root: data/realiad
  dataset_name: realiad
  img_size: 256
  meta_dir: ./data/realiad_meta/realiad_jsons
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  test_batch_size: 8
  train_batch_size: 64
  transform_type: imagenet
flow_matching:
  loss_type: velocity
  pred_type: velocity
  scheduler:
    name: affine_prob
    t_mu: -2.1972246
    t_scheduler_infer: linear
    t_scheduler_train: linear
    t_sigma: 0.35
  solver:
    name: euler
  train_steps: -1
logging:
  ckpt:
    ckpt_epoch_freq: 50
    save_best: false
    save_latest: false
    save_model_only: true
  eval:
    eval_epoch_freq: 1000
    img_score_agg: diff+sum
    inv_stop_time: 0.2
    metrics:
    - img_auroc
    - img_ap
    - img_f1max
    - px_auroc
    - px_ap
    - px_f1max
    - px_aupro
    recon_steps: 1
    solver_name: euler
    steps: 1
  log_dir: logs/realiad_ditS_dinoG_pilot/regulator/
  log_stdout: true
  log_step_freq: 100
  use_csv: true
  use_tensorboard: true
  vis:
    denorm_type: imagenet
    num_samples_per_class: 16
    solver_name: midpoint
    steps: 50
    vis_epoch_freq: 500
  wandb:
    entity: shuns71
    project_name: VFAD
    run_name: realiad_regulator_ditS_enet_fm_t02
    use_wandb: false
meta:
  name: vfad
model:
  backbone:
    final_norm: true
    model_name: dinov2-giant
    normalization: null
    out_blocks:
    - -1
    pretrained: true
  class_dropout_prob: 0.0
  cond_channels: 384
  depth: 12
  hidden_size: 384
  learn_sigma: false
  mlp_ratio: 4.0
  model_name: dit
  num_heads: 6
  patch_size: 1
  t_scale: 1000
  use_class_labels: true
opt:
  all_gather: false
  bias_decay: false
  clip_grad: 1.0
  epochs: 50
  fix_lr_strategy: const
  fix_lr_thres: -1
  fix_wd_strategy: const
  fix_wd_thres: -1
  global_seed: 0
  ipe_scale: 1.0
  lr_end: 5.0e-06
  lr_start: 1.0e-06
  lr_warmup: 5.0e-05
  lr_warmup_epochs: 10
  name: adamw
  norm_decay: false
  use_bfloat16: true
  wd_end: 0.0
  wd_start: 0.0
resume:
  resume_path: null
