meta: 
  name: vfad
  global_seed: 0
  use_bfloat16: False
data:
  data_root: data/mvtec_ad
  dataset_name: mvtec_ad_all
  category: all
  test_batch_size: 4 # per GPU batch size for evaluation
  num_workers: 8
  pin_memory: True
  persistent_workers: False
  img_size: 256
  transform_type: imagenet
flow_matching:
  scheduler: 
    name: affine_prob
    t_scheduler_train: linear
    t_scheduler_infer: linear
    t_mu: -0.8
    t_sigma: 0.8
  solver:
    name: euler
  pred_type: velocity # [data, noise, velocity]
  loss_type: velocity # [data, noise, velocity]
  train_steps: -1
model:
  backbone: 
    model_name: vae
    pretrained: true
    normalization: null
  model_name: mlp
  model_name: mlp
  patch_size: 1
  in_channels: 16
  model_channels: 768
  out_channels: 16
  z_channels: 15
  num_blocks: 12
  class_dropout_prob: 0.0
  use_class_labels: True
  learn_sigma: False
  t_scale: 1000
resume:
  resume_path: ./logs/ad_mc_mlp_vae_diffusion_1/checkpoints/ckpt_epoch_300.pth
logging:
  log_dir: logs/ad_mc_mlp_vae_diffusion_1/
  eval:
    eval_strategy: recon  # options: 'density', 'recon', 'inversion'
    exact_divergence: False
    steps: 1
    # for density estimation if eval_strategy is 'density'
    hutchinson_samples: 10
    hutchinson_batch_size: 2
    # for reconstruction if eval_strategy is 'recon'
    inv_steps: 20
    recon_steps: 1 # for reconstruction, we use inv/recon steps instead of 'steps'
    inv_stop_time: 0.8
    solver_name: euler
    img_score_agg: diff+sum
    metrics: 
      - img_auroc
      - img_ap
      - img_f1max
      - px_auroc
      - px_ap
      - px_f1max
      - px_aupro
    save_dir: ./logs/ad_mc_mlp_vae_diffusion_1/reconstruction/

    






  