meta: 
  name: vfad
  global_seed: 0
  use_bfloat16: False
data:
  data_root: data/mvtec_ad
  dataset_name: mvtec_ad_all
  category: all
  test_batch_size: 4 # per GPU batch size for evaluation
  num_workers: 8
  pin_memory: True
  persistent_workers: False
  img_size: 256
  transform_type: imagenet
flow_matching:
  scheduler: 
    name: vp
    t_scheduler_train: linear
    t_scheduler_infer: linear
    t_mu: -0.8
    t_sigma: 0.8
    params:
      beta_min: 0.1
      beta_max: 20.0
  solver:
    name: euler
  pred_type: noise # [data, noise, velocity]
  loss_type: noise # [data, noise, velocity]
  train_steps: -1
model:
  backbone:
    model_name: efficientnet-b4
    normalization: null
    outblocks:
    - 1
    - 5
    - 9
    - 21
    outstrides:
    - 2
    - 4
    - 8
    - 16
    pretrained: true
  class_dropout_prob: 0.0
  cond_channels: 768
  depth: 12
  hidden_size: 768
  learn_sigma: false
  mlp_ratio: 4.0
  model_name: dit
  num_heads: 12
  patch_size: 1
  t_scale: 1000
  use_class_labels: true
resume:
  resume_path: ./logs/ad_mc_ditB_enet_ddpm_0817/checkpoints/ckpt_epoch_300.pth
logging:
  log_dir: logs/ad_mc_ditB_enet_ddpm_0817/
  eval:
    eval_strategy: recon  # options: 'density', 'recon', 'inversion'
    exact_divergence: False
    steps: 1
    ablation_steps: [1, 2, 4, 8, 20, 40, 80, 200] # defualt: [-1] 
    # for density estimation if eval_strategy is 'density'
    hutchinson_samples: 10
    hutchinson_batch_size: 2
    # for reconstruction if eval_strategy is 'recon'
    inv_steps: 20
    recon_steps: 1 # for reconstruction, we use inv/recon steps instead of 'steps'
    inv_stop_time: 0.5
    solver_name: euler
    img_score_agg: diff+sum
    metrics: 
      - img_auroc
      - img_ap
      - img_f1max
      - px_auroc
      - px_ap
      - px_f1max
      - px_aupro
    save_dir: /home/haselab/projects/sakai_ssd/FlowAD/artifacts/design_ablations/rawdata/framework/ddim

    






  