meta: 
  name: vfad
  global_seed: 0
  use_bfloat16: False
data:
  data_root: data/mvtec_ad
  dataset_name: mvtec_ad_all
  category: all
  test_batch_size: 4 # per GPU batch size for evaluation
  num_workers: 8
  pin_memory: True
  persistent_workers: False
  img_size: 256
  transform_type: imagenet
flow_matching:
  scheduler: 
    name: affine_prob
    t_scheduler_train: linear
    t_scheduler_infer: linear
    t_mu: -0.8
    t_sigma: 0.8
  solver:
    name: euler
  pred_type: velocity # [data, noise, velocity]
  loss_type: velocity # [data, noise, velocity]
  train_steps: -1
model:
  backbone: 
    model_name: vae-kl16
    pretrained: true
    normalization: null
  model_name: mlp
  model_name: mlp
  patch_size: 1
  in_channels: 16
  model_channels: 768
  out_channels: 16
  z_channels: 15
  num_blocks: 12
  class_dropout_prob: 0.0
  use_class_labels: True
  learn_sigma: False
  t_scale: 1000
resume:
  resume_path: logs/ad_mc_mlp_vae_062517/checkpoints/ckpt_epoch_300.pth
logging:
  log_dir: logs/ad_mc_mlp_vae_062517/
  analysis:
    num_noise_per_sample: 1
    gmm_val_ratio: 0.01
    gmm_K: 4
    gmm_cov_type: diag

    






  